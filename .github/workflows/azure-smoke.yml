name: azure-smoke-test
on:
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request the OIDC token
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az account show --query "{name:name, user:user.name}" --output json
      - run: az storage blob list --account-name stnbapred060725 --container-name raw --auth-mode login --output table
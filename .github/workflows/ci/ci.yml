name: ci
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python --version
      - run: echo "Triggered by ${{ github.event_name }} on ${{ github.sha }}"
      - run: exit 1
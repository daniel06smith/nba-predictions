name: probe-nba-api
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/probe_nba_api.py
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nba_api pandas
      - run: python scripts/probe_nba_api.py